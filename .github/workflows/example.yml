name: example

on:
  push:
  pull_request:

jobs:
  verify:
    # Not ubuntu-latest for now: its kernel (7.0.0 in image 20261018) is one MongoDB 8 refuses to
    # start on, from 6.19 up to 7.0.13 (https://jira.mongodb.org/browse/SERVER-125742). Go back
    # once the 24.04 image ships kernel 7.0.14 or later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Wicket 10.11 can't create its @SpringBean proxies on Java 26+, so pin 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Skill assets match the example
        run: |
          for f in ArchitectureTests SpecTraceabilityTests; do
            diff -u "example/src/test/java/com/acme/shop/$f.java" "fullstack4j/assets/$f.java"
          done

      # Errors fail the build. The one warning, "No version specified", is deliberate: without
      # a version, plugin users follow this repository's commits
      - name: Validate the plugin and the marketplace
        run: |
          npx -y @anthropic-ai/claude-code@2.1.306 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.306 plugin validate ./fullstack4j

      - name: Build and test the example
        working-directory: example
        run: ./mvnw -B verify
