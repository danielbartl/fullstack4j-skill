<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <title>Open orders</title>
</head>
<body>
<main class="container">
    <!-- Plain HTML. A designer can open it in a browser. -->
    <h1>Open orders</h1>

    <ul wicket:id="list">
        <li wicket:id="orders">
            <span wicket:id="customer">Jane Doe</span>
            <button wicket:id="ship">Ship</button>
        </li>
    </ul>
</main>
</body>
</html>
